# Builds IV Studio for Linux (an AppImage) on GitHub's Ubuntu machines and checks it: the unit tests, the bundled
# ffmpeg, a real website capture and a Shinobi render with Chrome, the MCP server from the AppImage, and the window
# opening every page under a virtual display (pictures of each page are kept with the build).
# Run it by hand (Actions -> Linux -> Run workflow); with a release tag, the AppImage and latest-linux.yml are added
# to that release, which is how Linux copies update themselves.
name: Linux

on:
  workflow_dispatch:
    inputs:
      release:
        description: Add the AppImage to this release tag (blank = build and check only)
        required: false
        default: ''
  push:
    branches: [linux]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y xvfb libfuse2t64 python3-aiohttp
      - run: npm ci
      - name: Build the AppImage
        run: npm run dist:linux
      - name: Checks
        run: bash scripts/ci-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iv-studio-linux
          path: |
            dist/IV-Studio.AppImage
            dist/latest-linux.yml
            ci-out/
          if-no-files-found: warn
      - name: Add to the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release }}" dist/IV-Studio.AppImage dist/latest-linux.yml --clobber
